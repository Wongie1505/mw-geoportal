<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Malawi Geoportal</title>
    <meta name="description" content="Log in to the Malawi Geoportal to request restricted datasets, follow your access requests, join a department and upload spatial data from your account.">
    <meta name="keywords" content="Malawi geoportal login, log in GIS account Malawi, access restricted datasets Malawi, department dashboard GIS, Malawi spatial data account, request access geodata">

    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/css/forms.css">
    <link rel="stylesheet" href="../shared/css/footer.css">
</head>
<body>
    <header id="site-header" class="site-header"></header>

    <main class="container">
        <section class="auth-card">
            <h1>Log in</h1>
            <p class="subtitle">Access your account.</p>

            <div id="message" class="message" role="alert"></div>

            <form id="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="button">Log in</button>
            </form>

            <p class="switch">No account yet? <a href="../register/register.html">Register</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <strong>Malawi Geoportal</strong>
                <p>Spatial data from Malawian departments.</p>
            </div>
            <nav class="footer-links" aria-label="Footer">
                <a href="/catalog/catalog.html">Datasets</a>
                <a href="/about/about.html">About</a>
                <a href="/terms/terms.html">Terms of Use</a>
                <a href="/privacy/privacy.html">Privacy</a>
            </nav>
        </div>
        <p class="footer-copy">&copy; 2026 Malawi Geoportal</p>
    </footer>

    <script type="module" src="login.js"></script>
</body>
</html>
