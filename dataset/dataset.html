<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset | Malawi Geoportal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/css/forms.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="dataset.css">
</head>
<body>
    <header id="site-header" class="site-header"></header>

    <main class="container">
        <a class="button button-outline back-button" href="../catalog/catalog.html">Back to datasets</a>

        <div id="message" class="message" role="alert"></div>

        <article id="dataset" hidden>
            <header class="dataset-header">
                <h1 id="title"></h1>
                <div id="badges" class="badges"></div>
                <p id="status-notice" class="notice" hidden></p>
                <p id="abstract" class="abstract"></p>
            </header>

            <div class="dataset-layout">
                <section>
                    <div id="map" class="map"></div>
                    <p id="map-status" class="map-status"></p>
                    <div id="raster-controls" class="raster-controls" hidden>
                        <label for="opacity">Opacity</label>
                        <input type="range" id="opacity" min="10" max="100" value="80">
                    </div>
                    <div id="access-panel" class="access-panel" hidden></div>
                </section>

                <aside class="side-panel">
                    <section>
                        <h2>Details</h2>
                        <dl id="details" class="details"></dl>
                    </section>

                    <section id="raster-section" hidden>
                        <h2>Legend</h2>
                        <div id="legend" class="legend"></div>
                    </section>

                    <section id="feature-section">
                        <h2>Feature information</h2>
                        <div id="feature-info" class="feature-info">
                            <p class="hint">Click a feature on the map to see its attributes.</p>
                        </div>
                    </section>
                </aside>
            </div>

            <footer class="dataset-footer">
                <div id="download-box" class="download-box" hidden>
                    <div class="download-controls">
                        <label for="download-format">Download as</label>
                        <select id="download-format">
                            <option value="geojson">GeoJSON</option>
                            <option value="shapefile">Shapefile (zip)</option>
                        </select>
                        <button id="download-button" type="button" class="button">Download</button>
                    </div>
                    <p id="download-hint" class="field-hint"></p>
                </div>

                <div id="dataset-actions" class="dataset-actions"></div>
            </footer>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
    <script type="module" src="dataset.js"></script>
</body>
</html>
