<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Geospatial Datasets | Malawi Geoportal</title>
    <meta name="description" content="Search the catalog of geospatial datasets from Malawian departments by title, keyword, department or access level, including public and restricted GIS data.">
    <meta name="keywords" content="Malawi GIS datasets, search geospatial data Malawi, Malawi spatial data catalog, public GIS data Malawi, restricted geodata Malawi, Malawi department datasets, GeoTIFF Malawi, shapefiles Malawi, land use data Malawi, TheGISguy, Wongani Msukwa, Harineck Tholo">

    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/css/forms.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="../shared/css/footer.css">
    <link rel="stylesheet" href="catalog.css">
</head>
<body>
    <header id="site-header" class="site-header"></header>

    <main class="container catalog">
        <h1>Datasets</h1>
        <p class="subtitle">Spatial data published by Malawian departments.</p>

        <div class="filters">
            <input type="search" id="search" placeholder="Search by title, description or keyword" aria-label="Search datasets">

            <select id="department" aria-label="Department">
                <option value="">All departments</option>
            </select>

            <select id="access" aria-label="Access level">
                <option value="">All access levels</option>
                <option value="public">Public</option>
                <option value="restricted">Restricted</option>
                <option value="internal">Internal</option>
            </select>
        </div>

        <div id="message" class="message" role="alert"></div>
        <p id="result-count" class="result-count"></p>
        <div id="dataset-grid" class="dataset-grid"></div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <strong>Malawi Geoportal</strong>
                <p>Spatial data from Malawian departments.</p>
            </div>
            <nav class="footer-links" aria-label="Footer">
                <a href="/catalog/catalog.html">Datasets</a>
                <a href="/about/about.html">About</a>
                <a href="/terms/terms.html">Terms of Use</a>
                <a href="/privacy/privacy.html">Privacy</a>
            </nav>
        </div>
        <p class="footer-copy">&copy; 2026 Malawi Geoportal</p>
    </footer>

    <script type="module" src="catalog.js"></script>
</body>
</html>
